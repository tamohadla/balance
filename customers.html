<!doctype html>
<html lang="ar" dir="rtl" data-auth-pending>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>الزبائن | BALANCE</title>
    <style>
      html[data-auth-pending] body > :not(#authGate) {
        display: none !important;
      }
    </style>
    <link rel="stylesheet" href="css/auth.css?v=code-quality-1" />
    <link rel="stylesheet" href="css/accounts.css?v=code-quality-1" />
    <link rel="stylesheet" href="css/common.css?v=code-quality-1" />
    <link rel="stylesheet" href="css/pages/contacts.css?v=2" />
    <link rel="stylesheet" href="css/controls.css?v=ui-consistency-1" />
    <link rel="icon" type="image/x-icon" href="./favicon.ico?v=adlatex-1" />
  </head>
  <body class="ui-page" data-contact-type="customers">
    <div id="authGate" role="status">
      جارٍ التحقق من الدخول… <a href="login.html">تسجيل الدخول</a>
    </div>
    <main class="contacts">
      <h1>إدارة الزبائن</h1>
      <section class="panel">
        <h2>طلبات إضافة الزبائن</h2>
        <button id="refreshRequests" class="secondary" type="button">تحديث الطلبات</button>
        <p id="requestListStatus" role="status"></p>
        <div id="requestList" class="scroll"></div>
      </section>
      <dialog id="reviewRequest" aria-labelledby="reviewTitle">
        <h2 id="reviewTitle">مراجعة طلب إضافة زبون</h2>
        <form id="reviewRequestForm">
          <div class="grid" id="reviewFields"></div>
          <label>بحث عن زبون موجود <input id="matchCustomer" type="search" /></label>
          <div id="customerMatches"></div>
          <label>سبب الإرجاع <input name="review_note" maxlength="500" /></label>
          <div class="actions">
            <button class="primary" type="submit">اعتماد كزبون جديد</button>
            <button class="secondary" id="linkCustomer" type="button" disabled>ربط بالموجود</button>
            <button class="secondary" id="returnRequest" type="button">إرجاع للتصحيح</button>
            <button class="secondary" id="closeReview" type="button">إغلاق</button>
          </div>
          <p id="reviewStatus" class="status" role="status"></p>
        </form>
      </dialog>
      <section class="panel" aria-labelledby="contactHeading">
        <h2 id="contactHeading">إضافة زبون</h2>
        <form id="contactForm">
          <div class="grid">
            <label>اسم الزبون <input name="name" maxlength="150" required /></label>
            <label>اسم المصنع أو البراند <input name="brand_name" maxlength="150" /></label>
            <label>رقم الموبايل <input name="phone" type="tel" dir="ltr" maxlength="40" /></label>
            <label>المكان (العنوان) <input name="address" maxlength="250" /></label>
            <label>
              التصنيف
              <select name="customer_category">
                <option value="regular">عملاء</option>
                <option value="vip">كبار عملاء</option>
              </select>
            </label>
          </div>
          <div class="actions">
            <button class="primary" type="submit">حفظ</button>
          </div>
          <p id="saveStatus" class="status" role="status"></p>
        </form>
      </section>
      <section class="panel" aria-labelledby="listHeading">
        <h2 id="listHeading">سجل الزبائن</h2>
        <div class="actions">
          <label for="contactSearch">بحث بالاسم أو المصنع أو البراند أو الموبايل</label>
          <input id="contactSearch" type="search" />
          <label for="contactCategory">التصنيف</label>
          <select id="contactCategory">
            <option value="">الكل</option>
            <option value="regular">عملاء</option>
            <option value="vip">كبار عملاء</option>
          </select>
          <button id="openContactImport" class="secondary" type="button">استيراد Excel</button>
          <button id="reloadContacts" class="secondary" type="button">تحديث</button>
        </div>
        <p id="listStatus" class="status" role="status"></p>
        <div class="scroll">
          <table>
            <thead>
              <tr>
                <th scope="col">اسم الزبون</th>
                <th scope="col">المصنع أو البراند</th>
                <th scope="col">رقم الموبايل</th>
                <th scope="col">المكان (العنوان)</th>
                <th scope="col">التصنيف</th>
                <th scope="col">الإجراءات</th>
              </tr>
            </thead>
            <tbody id="contactRows"></tbody>
          </table>
        </div>
      </section>
      <dialog id="contactEdit" aria-labelledby="contactEditTitle">
        <h2 id="contactEditTitle">تعديل البيانات</h2>
        <form id="contactEditForm">
          <div class="grid" id="contactEditFields"></div>
          <div class="actions">
            <button class="primary" type="submit">حفظ التعديل</button>
            <button class="secondary" id="closeContactEdit" type="button">إلغاء</button>
          </div>
          <p id="editStatus" class="status" role="status"></p>
        </form>
      </dialog>
      <dialog id="contactImport" aria-labelledby="contactImportTitle">
        <h2 id="contactImportTitle">استيراد Excel</h2>
        <div class="actions">
          <button id="downloadContactTemplate" class="secondary" type="button">
            تنزيل النموذج
          </button>
        </div>
        <label for="contactFile">ملف Excel (.xlsx أو .xls)</label>
        <input id="contactFile" type="file" accept=".xlsx,.xls" />
        <p id="importStatus" class="status" role="status"></p>
        <div id="importPreview" class="scroll"></div>
        <div class="actions">
          <button id="confirmContactImport" class="primary" type="button" disabled>
            تأكيد الاستيراد
          </button>
          <button id="closeContactImport" class="secondary" type="button">إغلاق</button>
        </div>
      </dialog>
    </main>
    <script defer src="vendor/xlsx-0.20.3.min.js"></script>
    <script type="module" src="js/session-ui.js?v=code-quality-1"></script>
    <script type="module" src="js/contacts.js?v=2"></script>
    <script type="module" src="js/customer-requests.js"></script>
  </body>
</html>
