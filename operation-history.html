<!doctype html>
<html lang="ar" dir="rtl" data-auth-pending>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>سجل العمليات | ADLATEX</title>
    <style>
      html[data-auth-pending] body > :not(#authGate) {
        display: none !important;
      }
    </style>
    <link rel="stylesheet" href="./css/auth.css?v=code-quality-1" />
    <link rel="stylesheet" href="./css/app.css?v=code-quality-1" />
    <link rel="stylesheet" href="./css/common.css?v=code-quality-1" />
  </head>
  <body>
    <div id="authGate">جارٍ التحقق من الدخول…</div>
    <main class="container">
      <h1>سجل العمليات</h1>
      <p class="muted">
        للمدير فقط. يبدأ التسجيل من وقت تفعيل هذه الميزة، ويشمل التغييرات المنفذة من حسابات الموقع.
      </p>
      <div class="card toolbar">
        <label
          >القسم<select id="eventEntity">
            <option value="">كل الأقسام</option>
            <option value="items">المواد</option>
            <option value="stock_moves">حركات المخزون</option>
            <option value="customer_orders">الطلبات</option>
            <option value="customer_order_lines">أصناف الطلبات</option>
            <option value="recon_sessions">التسويات</option>
          </select></label
        ><label
          >العملية<select id="eventAction">
            <option value="">كل العمليات</option>
            <option value="insert">إضافة</option>
            <option value="update">تعديل</option>
            <option value="delete">حذف</option>
          </select></label
        ><label>من<input type="date" id="eventFrom" /></label
        ><label>إلى<input type="date" id="eventTo" /></label><button id="reloadEvents">عرض</button
        ><button id="clearEvents" class="secondary">مسح الفلاتر</button>
      </div>
      <p id="eventsMsg" role="status"></p>
      <div class="card tableWrap">
        <table>
          <thead>
            <tr>
              <th>التاريخ والوقت</th>
              <th>المستخدم</th>
              <th>القسم</th>
              <th>العملية</th>
              <th>التفاصيل</th>
            </tr>
          </thead>
          <tbody id="eventsBody"></tbody>
        </table>
      </div>
      <div class="toolbar">
        <button id="prevEvents" class="secondary">السابق</button><span id="eventsPage"></span
        ><button id="nextEvents" class="secondary">التالي</button>
      </div>
    </main>
    <script type="module" src="./js/session-ui.js?v=code-quality-1"></script>
    <script type="module" src="./js/operation-history.js?v=code-quality-1"></script>
  </body>
</html>
